name: Deploy Backend - NutriLife

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

jobs:
  # ============================================================
  # JOB 1: Qualidade — build, lint e testes
  # ============================================================
  quality:
    name: Quality Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      DATABASE_URL: mongodb://admin:mypass@localhost:27017/nutrilife_ci?authSource=admin
      TOKEN_SECRET: ci-only-token-secret-with-at-least-32-characters
      TOKEN_EXPIRATION: 1h
      PORT: 3000
      ALLOWED_ORIGINS: http://localhost:3000

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Iniciar MongoDB
        run: docker compose -f ../docker-compose.ci.yml up -d --wait

      - name: Verificar build TypeScript
        run: npm run build

      - name: Executar testes unitários
        run: npm test -- --forceExit --passWithNoTests

      - name: Encerrar serviços de teste
        if: always()
        run: docker compose -f ../docker-compose.ci.yml down

  # ============================================================
  # JOB 2: Deploy — conecta no servidor e atualiza o container
  # ============================================================
  deploy:
    name: Deploy to Server
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Conectar no servidor e executar deploy do Backend
        uses: appleboy/ssh-action@v1.0.3
        env:
          ENV_CONTENT: ${{ secrets.ENV_FILE_PRODUCTION }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          envs: ENV_CONTENT
          script: |
            set -e

            echo ">>> Acessando diretório do projeto..."
            cd /var/www/nutrilife

            echo ">>> Atualizando código do backend..."
            cd backend
            git fetch origin main
            git reset --hard origin/main
            cd ..

            echo ">>> Injetando variáveis de ambiente..."
            echo "$ENV_CONTENT" > backend/.env

            echo ">>> Reconstruindo e reiniciando o container do backend..."
            docker compose build backend
            docker compose up -d --wait backend

            echo ">>> Limpando imagens antigas..."
            docker image prune -f

            echo ">>> Deploy do Backend concluído com sucesso!"
