name: Deploy Frontend - NutriLife

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-deploy.yml"
  workflow_dispatch:

jobs:
  # ============================================================
  # JOB 1: Qualidade — build e type-check
  # ============================================================
  quality:
    name: Quality Check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar build Next.js
        run: npm run build
        env:
          # URL placeholder apenas para validar o build — Vercel usa a variável real
          NEXT_PUBLIC_API_URL: https://placeholder.example.com/api/

  # ============================================================
  # JOB 2: Deploy — aciona redeploy no Vercel via Deploy Hook
  # ============================================================
  deploy:
    name: Deploy to Vercel
    needs: quality
    runs-on: ubuntu-latest

    steps:
      - name: Acionar deploy no Vercel
        run: |
          curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}" \
            -o /dev/null \
            -w "HTTP Status: %{http_code}\n"
